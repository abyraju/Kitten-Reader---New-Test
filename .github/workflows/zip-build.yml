name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: KittenTTSApp
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        working-directory: .
        run: unzip -q KittenReader.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Fetch KittenTTS Rust port
        run: git clone --depth 1 https://github.com/eugenehp/kittentts-rs.git rs
      - name: Build native libraries
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          bash rs/android/build_rust_android.sh
      - name: Copy native libs and model data into the app
        run: |
          src=rs/android/KittenTTSApp/app/src/main
          mkdir -p app/src/main/jniLibs app/src/main/assets
          cp -r "$src/jniLibs/." app/src/main/jniLibs/
          cp -r "$src/assets/." app/src/main/assets/
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KittenReader-apk
          path: KittenTTSApp/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KittenReader.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest KittenReader.apk --title "KittenReader (latest build)" --notes "Debug build. Install KittenReader.apk on your phone."

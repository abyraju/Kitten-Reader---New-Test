name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q KittenReader.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build (native libs + APK)
        working-directory: KittenTTSApp
        run: bash ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KittenReader-apk
          path: KittenTTSApp/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        working-directory: KittenTTSApp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KittenReader.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest KittenReader.apk --title "KittenReader (latest build)" --notes "Debug build. Install KittenReader.apk on your phone."
